site:
  name: 'Rock Wong — Founder of ENCORE'
  site: 'https://www.encore-tech.com/'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: false

metadata:
  title:
    default: 'Rock Wong — Founder of ENCORE'
    template: '%s — ENCORE'
  description: 'The story, philosophy and work of Rock Wong, founder of ENCORE.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: ENCORE
    images:
      - url: '~/assets/images/hero-image.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@encore'
    site: '@encore'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/blog/%slug%'
      robots: { index: false }
    list:
      isEnabled: false
      pathname: 'blog'
      robots: { index: false }
    category:
      isEnabled: false
      pathname: 'category'
      robots: { index: false }
    tag:
      isEnabled: false
      pathname: 'tag'
      robots: { index: false }
    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'

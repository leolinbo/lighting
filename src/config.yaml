site:
  name: ENCORE
  site: 'https://lightoem.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: 'H3l2b1Z8ab97w9lNqRUNqa1X6FuayO_EZSU2tNT8of0'

# Default SEO metadata
metadata:
  title:
    default: ENCORE — Professional LED Track Lighting & Downlight Manufacturer
    template: '%s — ENCORE'
  description: 'Professional LED track lighting and downlight manufacturer offering OEM/ODM services. ETL/CE/ISO certified factory since 2011.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: ENCORE
    images:
      - url: '~/assets/images/logo.png'
        width: 4124
        height: 834
    type: website
  twitter:
    handle: '@encore'
    site: '@encore'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-1VKFQ8ZEW6'

ui:
  theme: 'system'

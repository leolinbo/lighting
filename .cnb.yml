# ============================================================
# Beamangle Release / 打包流水线
#
# 1. main 分支 push（日常更新）：
#    代码有更新时自动构建并打包 zip（源码包 + dist 产物包），
#    上传到对应 commit 的附件，可在 commit 页面直接下载。
#
# 2. tag_push（正式发版）：
#    推送 tag（如 v1.0.0）触发，构建 → 打包 → 自动创建 Release
#    → 将 zip 作为附件上传到 Release 页面。
# ============================================================

main:
  push:
    - name: package-on-update
      docker:
        build:
          dockerfile: ./Dockerfile.ci
          by: [package.json, package-lock.json]
          versionBy: [package-lock.json]
      # 仅当代码/配置有变更时打包；如需“任何 push 都打包”，删除 ifModify 即可
      ifModify:
        - "src/**"
        - "public/**"
        - "package.json"
        - "package-lock.json"
        - "astro.config.ts"
        - "tsconfig.json"
        - ".cnb.yml"
      stages:
        - name: build
          script: |
            set -e
            echo "==> 开始构建 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Dockerfile.ci 已在 /app 预装依赖，将 node_modules 复制到工作目录
            if [ -d /app/node_modules ] && [ ! -d node_modules ]; then
              cp -r /app/node_modules ./node_modules
            fi
            npm run build
            echo "==> 构建产物："
            ls -lh dist | head
        - name: package
          script: |
            set -e
            VERSION="nightly-${CNB_COMMIT_SHORT}"
            mkdir -p release
            # 源码包（排除依赖、Git、构建产物与打包目录）
            zip -r "release/Beamangle-${VERSION}-source.zip" . \
              -x "node_modules/*" ".git/*" ".output/*" ".astro/*" "dist/*" "release/*" "*.log"
            # 构建产物包（可直接部署/预览）
            zip -r "release/Beamangle-${VERSION}-dist.zip" dist
            echo "==> 打包完成："
            ls -lh release/
        - name: upload-to-commit
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "release/*.zip"
        - name: deploy-to-vercel
          # Vercel 自动部署（production）。
          # 密钥：VERCEL_TOKEN 通过密钥仓库 imports 注入（见文末配置指引）。
          # 项目信息已内嵌，无需再通过环境变量提供：
          #   VERCEL_ORG_ID      = team_o0BtTLWzAHnGL2hIHk6iMnZs
          #   VERCEL_PROJECT_ID  = prj_cpAHrPXwDLRBSEMietKswTgknpFx
          # 未配置 VERCEL_TOKEN 时自动跳过，不影响构建。
          script: |
            set -e
            if [ -z "${VERCEL_TOKEN}" ]; then
              echo "==> VERCEL_TOKEN 未配置，跳过 Vercel 部署（密钥仓库配置后即自动生效）"
              exit 0
            fi
            echo "==> 部署到 Vercel (production) ..."
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "team_o0BtTLWzAHnGL2hIHk6iMnZs" \
              "prj_cpAHrPXwDLRBSEMietKswTgknpFx" > .vercel/project.json
            export VERCEL_ORG_ID="team_o0BtTLWzAHnGL2hIHk6iMnZs"
            export VERCEL_PROJECT_ID="prj_cpAHrPXwDLRBSEMietKswTgknpFx"
            # 先构建 Vercel 部署包（生成 .vercel/output），再以 prebuilt 方式部署，
            # 避免 CLI 在无关联项目时误建名为 dist 的新项目。
            if ! npx --yes vercel build --prod --token="${VERCEL_TOKEN}" --yes; then
              echo "==> vercel build 失败"
              exit 1
            fi
            if ! npx --yes vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}" --yes; then
              echo "==> Vercel 部署失败"
              exit 1
            fi
            echo "==> Vercel 部署完成"

"$":
  tag_push:
    - name: release
      docker:
        build:
          dockerfile: ./Dockerfile.ci
          by: [package.json, package-lock.json]
          versionBy: [package-lock.json]
      stages:
        - name: build
          script: |
            set -e
            echo "==> 构建 Release $CNB_BRANCH"
            # Dockerfile.ci 已在 /app 预装依赖，将 node_modules 复制到工作目录
            if [ -d /app/node_modules ] && [ ! -d node_modules ]; then
              cp -r /app/node_modules ./node_modules
            fi
            npm run build
        - name: package
          script: |
            set -e
            VERSION="${CNB_BRANCH}"
            mkdir -p release
            # 生成 Release 描述
            cat > RELEASE_NOTES.md <<EOF
            # Beamangle Release ${VERSION}

            - 提交: ${CNB_COMMIT}
            - 构建号: ${CNB_BUILD_ID}
            - 发布时间: $(date -u '+%Y-%m-%d %H:%M UTC')
            EOF
            # 源码包（排除依赖、Git、构建产物与打包目录）
            zip -r "release/Beamangle-${VERSION}-source.zip" . \
              -x "node_modules/*" ".git/*" ".output/*" ".astro/*" "dist/*" "release/*" "*.log"
            # 构建产物包（可直接部署/预览）
            zip -r "release/Beamangle-${VERSION}-dist.zip" dist
            echo "==> 打包完成："
            ls -lh release/
        - name: create-release
          type: git:release
          options:
            title: "Release $CNB_BRANCH"
            descriptionFromFile: RELEASE_NOTES.md
        - name: upload-release-assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "release/*.zip"
